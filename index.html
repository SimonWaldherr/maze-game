<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Maze TD</title>
  <meta name="description" content="Browser tower defense — multiple maps, modes, i18n, particles, audio.">
  <style>
    :root {
      --bg:#0d0f14;--surface:#131722;--surface-2:#161b27;
      --panel:#1b2130;--ink:#e8edf5;--muted:#a7b4c8;
      --accent:#67e8f9;--good:#7efca5;--warn:#ffd166;
      --bad:#ff6b6b;--line:#212a3a;--shadow:rgba(0,0,0,.3);
    }
    *{box-sizing:border-box;}
    html,body{height:100%;margin:0;}
    body{background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
    .wrap{max-width:980px;margin:0 auto;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;}
    header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
    .stats{display:flex;gap:8px;align-items:center;flex:1;flex-wrap:wrap;}
    .stat-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 8px;border-radius:999px;background:var(--surface);border:1px solid #2a3346;font-weight:700;font-size:13px;}
    .stat-chip .val{color:var(--accent);font-variant-numeric:tabular-nums;}
    .stat-chip .val.warn{color:var(--warn);}.stat-chip .val.bad{color:var(--bad);}
    .controls{display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
    .btn{appearance:none;border:1px solid #2a3346;background:var(--surface);border-radius:8px;color:var(--ink);font-weight:800;font-size:12px;padding:7px 10px;min-width:36px;text-align:center;user-select:none;cursor:pointer;box-shadow:0 2px 8px var(--shadow);transition:opacity .15s;}
    .btn:active{transform:translateY(1px);}.btn[disabled]{opacity:.45;pointer-events:none;}
    .btn.primary{background:linear-gradient(180deg,#1e2b42,#111726);border-color:#2e4060;}
    .btn.active-spd{outline:2px solid var(--accent);}.btn.tiny{padding:4px 7px;font-size:11px;}.btn.bad{outline:2px solid var(--bad);}
    #gameHolder{position:relative;background:var(--surface-2);overflow:hidden;display:flex;align-items:center;justify-content:center;}
    #game{display:block;background:#0b0f16;touch-action:none;}
    .legend{position:absolute;right:8px;bottom:8px;background:rgba(20,26,40,.88);border:1px solid #2b3448;border-radius:8px;padding:7px 9px;font-size:11px;color:var(--muted);pointer-events:none;line-height:1.6;}
    .legend kbd{background:#1e2738;border:1px solid #2a3448;border-radius:4px;padding:1px 4px;font-size:10px;}
    .toast{position:absolute;left:50%;top:12px;transform:translateX(-50%) translateY(-6px);background:rgba(12,14,22,.94);border:1px solid #2c354a;color:var(--ink);padding:9px 14px;font-weight:800;border-radius:10px;box-shadow:0 8px 28px var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:50;text-align:center;max-width:min(92vw,500px);}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    .palette{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line);}
    .card{border:1px solid #2a3346;background:var(--surface);border-radius:10px;padding:7px 5px;text-align:center;position:relative;cursor:pointer;transition:border-color .15s;}
    .card:hover{border-color:#3d5070;}.card h4{margin:2px 0 2px;font-size:12px;line-height:1.2;}
    .price{color:var(--warn);font-weight:700;font-size:10px;}.card-key{color:var(--muted);font-size:9px;margin-top:2px;}
    .card.selected{outline:2px solid var(--accent);border-color:var(--accent);}
    .card-icon{font-size:16px;line-height:1;margin-bottom:2px;}.card-desc{color:var(--muted);font-size:9px;margin-top:2px;line-height:1.3;}
    .bar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--surface);border-top:1px solid var(--line);flex-wrap:wrap;}
    .wave-preview{display:flex;gap:7px;align-items:center;color:var(--muted);font-weight:700;font-size:12px;}
    .icon-row{display:flex;gap:4px;}
    .combo-display{font-weight:800;font-size:13px;color:var(--warn);display:none;}
    .combo-display.active{display:inline-block;}
    .inspector{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(16,21,32,.96);border:1px solid #2a3346;border-radius:12px;padding:10px 12px;min-width:min(92vw,500px);z-index:20;display:none;box-shadow:0 16px 40px var(--shadow);}
    .inspector.show{display:block;}
    .inspector .row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;}
    .inspector h4{margin:0 0 7px;font-size:14px;}.kv{color:var(--muted);font-weight:700;font-size:13px;line-height:1.6;}
    .kv b{color:var(--ink);}.hr{height:1px;background:#2a3346;margin:7px 0;}
    .overlay{position:fixed;inset:0;background:rgba(8,10,16,.88);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px);overflow-y:auto;padding:12px;}
    .overlay.hidden{display:none;}
    .overlay-box{background:var(--panel);border:1px solid #2a3346;border-radius:18px;padding:24px 28px;text-align:center;max-width:min(92vw,480px);width:100%;box-shadow:0 24px 60px rgba(0,0,0,.5);}
    .overlay-box h1{margin:0 0 6px;font-size:26px;}.overlay-box h2{margin:0 0 10px;font-size:20px;}
    .overlay-box p{color:var(--muted);margin:0 0 16px;font-size:13px;line-height:1.6;}
    .overlay-box .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
    .stat-box{background:var(--surface);border:1px solid #2a3346;border-radius:10px;padding:8px;}
    .stat-box .label{color:var(--muted);font-size:11px;}.stat-box .number{font-size:20px;font-weight:800;color:var(--accent);}
    .overlay-btn{appearance:none;border:none;background:linear-gradient(180deg,#2563eb,#1d4ed8);color:#fff;font-weight:800;font-size:15px;border-radius:10px;padding:12px 28px;cursor:pointer;letter-spacing:.3px;box-shadow:0 4px 16px rgba(37,99,235,.4);transition:transform .1s;}
    .overlay-btn:hover{transform:translateY(-1px);}
    .lang-row{display:flex;justify-content:center;gap:6px;margin-bottom:14px;}
    .lang-btn{appearance:none;border:1px solid #2a3346;background:var(--surface);border-radius:7px;color:var(--muted);font-weight:700;font-size:12px;padding:5px 10px;cursor:pointer;transition:border-color .15s;}
    .lang-btn.active{border-color:var(--accent);color:var(--accent);}
    .selector-group{margin:12px 0;text-align:left;}
    .selector-group h3{color:var(--muted);font-size:11px;margin:0 0 7px;text-transform:uppercase;letter-spacing:.6px;text-align:center;}
    .selector-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
    .sel-card{border:1px solid #2a3346;background:var(--surface);border-radius:10px;padding:9px 7px;text-align:center;cursor:pointer;transition:border-color .15s;}
    .sel-card:hover{border-color:#3d5070;}.sel-card.active{outline:2px solid var(--accent);border-color:var(--accent);}
    .sel-card-icon{font-size:18px;margin-bottom:3px;}.sel-card-name{font-weight:700;font-size:12px;margin-bottom:2px;}
    .sel-card-desc{font-size:10px;color:var(--muted);line-height:1.3;}
    .wave-announce{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.7);font-size:28px;font-weight:900;color:#fff;text-shadow:0 0 24px var(--accent),0 2px 8px rgba(0,0,0,.8);pointer-events:none;opacity:0;z-index:30;transition:opacity .25s ease,transform .25s ease;}
    .wave-announce.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
    .mode-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--surface);border:1px solid #2a3346;color:var(--muted);}
    @media(max-width:520px){header{gap:4px;padding:5px 8px;}.palette{grid-template-columns:repeat(3,1fr);gap:4px;padding:6px 8px;}.inspector{min-width:96vw;}.overlay-box{padding:18px 16px;}.selector-cards{grid-template-columns:repeat(3,1fr);gap:5px;}}
  </style>
</head>
<body>

<!-- START OVERLAY -->
<div id="startOverlay" class="overlay">
  <div class="overlay-box">
    <h1>&#127984; Maze TD</h1>
    <div class="lang-row" id="langRow"></div>
    <div class="selector-group">
      <h3 id="mapLabel">Select Map</h3>
      <div class="selector-cards" id="mapCards"></div>
    </div>
    <div class="selector-group">
      <h3 id="modeLabel">Select Mode</h3>
      <div class="selector-cards" id="modeCards"></div>
    </div>
    <p id="startInstructions"></p>
    <button id="startBtn" class="overlay-btn">&#9654; Play</button>
  </div>
</div>

<!-- GAME OVER OVERLAY -->
<div id="gameOverOverlay" class="overlay hidden">
  <div class="overlay-box">
    <h2 id="gameOverTitle">&#128128; Game Over</h2>
    <div class="stats-grid">
      <div class="stat-box"><div class="label" id="goWaveLabel">Wave</div><div class="number" id="goWave">0</div></div>
      <div class="stat-box"><div class="label" id="goBestLabel">Best</div><div class="number" id="goBest">0</div></div>
      <div class="stat-box"><div class="label" id="goKillsLabel">Kills</div><div class="number" id="goKills">0</div></div>
      <div class="stat-box"><div class="label" id="goScoreLabel">Score</div><div class="number" id="goScore">0</div></div>
    </div>
    <button id="restartBtn" class="overlay-btn">&#8635; Play Again</button>
  </div>
</div>

<div class="wrap">
  <header>
    <div class="stats">
      <div class="stat-chip">&#128176; <span class="val" id="gold">500</span></div>
      <div class="stat-chip">&#10084;&#65039; <span class="val" id="lives">20</span></div>
      <div class="stat-chip">&#127754; <span class="val" id="wave">0</span><span style="color:var(--muted);font-size:10px" id="bestLabel"></span></div>
      <div class="stat-chip">&#9876; <span class="val" id="kills">0</span></div>
      <div class="stat-chip">&#127942; <span class="val" id="score">0</span></div>
      <span class="mode-badge" id="modeBadge"></span>
    </div>
    <div class="controls">
      <button id="langBtn"  class="btn" title="Language">&#127468;&#127463;</button>
      <button id="muteBtn"  class="btn" title="Mute (M)">&#128266;</button>
      <button id="pauseBtn" class="btn" title="Pause (Space)">&#9208;</button>
      <button id="speed1"   class="btn active-spd">1x</button>
      <button id="speed2"   class="btn">2x</button>
      <button id="speed3"   class="btn">3x</button>
      <button id="waveBtn"  class="btn primary">&#9654; Next Wave</button>
    </div>
  </header>

  <div id="gameHolder">
    <canvas id="game"></canvas>
    <div class="legend" id="legend"></div>
    <div id="toast" class="toast"></div>
    <div id="waveAnnounce" class="wave-announce"></div>
    <div id="inspector" class="inspector">
      <h4 id="insTitle">Tower Details</h4>
      <div class="row">
        <div class="kv"><span id="insTypeLabel">Type</span>: <b id="insType">-</b> &middot; <span id="insLvlLabel">Lv</span> <b id="insLvl">-</b><br>DPS: <b id="insDps">-</b> &middot; <span id="insRangeLabel">Range</span>: <b id="insRange">-</b></div>
        <button id="upgradeBtn" class="btn tiny">&#9651; Upgrade</button>
        <button id="sellBtn"    class="btn tiny bad">&#128465; Sell</button>
      </div>
      <div class="hr"></div>
      <div class="row">
        <div class="kv"><span id="insUpCostLabel">Upgrade</span>: <b id="insUpCost">-</b> &middot; <span id="insRefundLabel">Sell</span>: <b id="insRefund">-</b></div>
        <button id="closeInspector" class="btn tiny">&#x2715;</button>
      </div>
    </div>
  </div>

  <div class="palette" id="palette"></div>

  <div class="bar">
    <div class="wave-preview"><span id="nextWaveLabel">Next wave</span>: <span id="wavePreview" class="icon-row">-</span></div>
    <span id="comboDisplay" class="combo-display"></span>
  </div>
</div>

function t(key,...args){
  let s=(I18N[currentLang]&&I18N[currentLang][key])||I18N.en[key]||key;
  args.forEach((v,i)=>{s=s.replace("{"+i+"}",v);});
  return s;

// ===== Maps =====
function gauntletWalls(){
  const w=[];
  for(let r=0;r<=11;r++) w.push([4,r]);
  for(let r=8;r<=19;r++) w.push([9,r]);
  return w;
}
function islandWalls(){
  const w=[];
  for(let c=5;c<=8;c++) for(let r=5;r<=14;r++) w.push([c,r]);
  return w;
}

// ===== Towers =====

let audioCtx=null;
function getAC(){if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playTone(freq,type,dur,gain=0.15){
  if(muted)return;
  try{const ac=getAC();const o=ac.createOscillator();const g=ac.createGain();
  o.connect(g);g.connect(ac.destination);o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(gain,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+dur);
  o.start();o.stop(ac.currentTime+dur);}catch(e){}}
function playNoise(dur,gain=0.10){
  if(muted)return;
  try{const ac=getAC();const buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
  const src=ac.createBufferSource();src.buffer=buf;const g=ac.createGain();
  src.connect(g);g.connect(ac.destination);
  g.gain.setValueAtTime(gain,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+dur);
  src.start();src.stop(ac.currentTime+dur);}catch(e){}}

function makeMatrix(r,c,v=0){return Array.from({length:r},()=>Array(c).fill(v));}
function inBounds(c,r){return c>=0&&r>=0&&c<COLS&&r<ROWS;}
function gridToCenterPx(c,r){return {x:c*tile+tile/2,y:r*tile+tile/2};}
function pxToCell(x,y){return {c:Math.floor(x/tile),r:Math.floor(y/tile)};}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function showToast(msg,kind="info",ms=1400){

// ===== Particles =====
function spawnParticles(x,y,color,count,spd,life){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,s=spd*(0.5+Math.random());
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,color,life,maxLife:life,size:2+Math.random()*3});
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vy+=0.012;p.life-=dt;
    if(p.life<=0)particles.splice(i,1);
  }
}
function drawParticles(){
  for(const p of particles){
    ctx.save();ctx.globalAlpha=clamp(p.life/p.maxLife,0,1);
    ctx.fillStyle=p.color;ctx.beginPath();
    ctx.arc(p.x,p.y,p.size*(p.life/p.maxLife),0,Math.PI*2);ctx.fill();ctx.restore();
  }
}

function triggerShake(mag,dur){shakeMag=Math.max(shakeMag,mag);shakeT=Math.max(shakeT,dur);}

// ===== Lightning Arcs =====
function makeLightningPoints(x1,y1,x2,y2,segs){
  const pts=[{x:x1,y:y1}];
  for(let i=1;i<segs;i++){const tt=i/segs;pts.push({x:x1+(x2-x1)*tt+(Math.random()-.5)*tile*.5,y:y1+(y2-y1)*tt+(Math.random()-.5)*tile*.5});}
  pts.push({x:x2,y:y2});return pts;
}
function updateLightningArcs(dt){for(let i=lightningArcs.length-1;i>=0;i--){lightningArcs[i].life-=dt;if(lightningArcs[i].life<=0)lightningArcs.splice(i,1);}}
function drawLightningArcs(){
  for(const arc of lightningArcs){
    ctx.save();ctx.globalAlpha=clamp(arc.life/0.18,0,1);
    ctx.strokeStyle="#faff7a";ctx.lineWidth=1.5;ctx.shadowColor="#ffff00";ctx.shadowBlur=12;
    ctx.beginPath();ctx.moveTo(arc.pts[0].x,arc.pts[0].y);
    for(let i=1;i<arc.pts.length;i++)ctx.lineTo(arc.pts[i].x,arc.pts[i].y);
    ctx.stroke();ctx.restore();
  }
}

    ctx.font=Math.floor(tile*.3)+"px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";

function collectPowerup(pu){
  const idx=powerups.indexOf(pu);if(idx>=0)powerups.splice(idx,1);
  const maxLives=MODE_DEFS[currentMode].startLives;
  switch(pu.type){
    case "gold": gold+=30;showToast(t("powerupGold"),"good");break;
    case "life": lives=Math.min(lives+2,maxLives);showToast(t("powerupLife"),"good");break;
    case "freeze": for(const e of enemies)applySlow(e,.5,5.0);showToast(t("powerupFreeze"),"good");break;
    case "nuke":
      for(const e of enemies)applyDamage(e,80);
      spawnParticles(viewW/2,viewH/2,"#ffd166",28,tile*.28,.8);
      triggerShake(6,.3);showToast(t("powerupNuke"),"warn");break;
  }
  SFX.powerup();updateHUD();
}
function checkPowerupClick(x,y){
  const r2=Math.pow(tile*.4,2);
  for(let i=powerups.length-1;i>=0;i--){
    const pu=powerups[i];
    if((x-pu.x)*(x-pu.x)+(y-pu.y)*(y-pu.y)<=r2){collectPowerup(pu);return true;}
  }
  return false;
}

// ===== Flow Field =====
function buildFlowField(){
  flow=makeMatrix(ROWS,COLS,Infinity);
  const q=[];
  if(inBounds(GOAL.c,GOAL.r)&&grid[GOAL.r][GOAL.c]===0){flow[GOAL.r][GOAL.c]=0;q.push({c:GOAL.c,r:GOAL.r});}
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  while(q.length){const {c,r}=q.shift();const d=flow[r][c];
    for(const [dc,dr] of dirs){const nc=c+dc,nr=r+dr;
      if(!inBounds(nc,nr)||grid[nr][nc]!==0)continue;
      if(flow[nr][nc]>d+1){flow[nr][nc]=d+1;q.push({c:nc,r:nr});}
    }
  }
}
function pathExistsAfterPlacing(c,r){
  if(!inBounds(c,r)||grid[r][c]!==0)return false;
  if(c===START.c&&r===START.r||c===GOAL.c&&r===GOAL.r)return false;
  grid[r][c]=1;buildFlowField();
  const ok=flow[START.r][START.c]<Infinity;
  grid[r][c]=0;buildFlowField();return ok;
}

// ===== Tower helpers =====
function makeTower(c,r,typeKey){return {c,r,type:typeKey,lvl:1,cd:0,spent:TOWER_DEF[typeKey].baseCost,shootAnim:0};}
function towerRangePx(t){return TOWER_DEF[t.type].range(t.lvl)*tile;}
function towerDmg(t){return TOWER_DEF[t.type].dmg(t.lvl);}
function towerFireRate(t){
  const base=TOWER_DEF[t.type].fireRate(t.lvl);if(base<=0)return 0;
  let mul=1;
  for(const s of towers){if(s.type!=="support")continue;
    const rpx=TOWER_DEF.support.range(s.lvl)*tile;
    const p1=gridToCenterPx(t.c,t.r),p2=gridToCenterPx(s.c,s.r);
    if(Math.hypot(p1.x-p2.x,p1.y-p2.y)<=rpx)mul+=TOWER_DEF.support.buff(s.lvl);
  }
  return base*Math.min(mul,1.75);
}
function defKeyCost(type,lvl){const def=TOWER_DEF[type];if(lvl===1)return def.baseCost;return Math.floor(def.baseCost*Math.pow(def.costScale,lvl-1));}

// ===== Enemy helpers =====
function makeEnemy(kind,power){
  const d=ENEMY_DEF[kind];
  const hp=Math.floor(d.baseHp*Math.pow(d.hpScale,power-1));
  const spd=d.baseSpeed*Math.pow(d.speedScale,power-1)*(MODE_DEFS[currentMode]||{enemySpeedMul:1}).enemySpeedMul;
  const {x,y}=gridToCenterPx(START.c,START.r);
  return {kind,x,y,hp,maxHp:hp,speed:spd*tile,armor:d.armor,regen:d.regen,alive:true,target:null,slowMul:1.0,slowT:0.0};
}

// ===== Wave planning =====
function generateWavePlan(w){
  const plan=[];
  if(w>0&&w%5===0){
    for(let i=0;i<6;i++)plan.push("fast");
    plan.push("boss");
    for(let i=0;i<6;i++)plan.push("normal");
  } else {
    const count=Math.floor(clamp(10*Math.pow(1.15,w-1),8,60));
    for(let i=0;i<count;i++){
      const r=Math.random();let tp="normal";
      if(r<0.12)tp="fast";else if(r<0.25)tp="tank";else if(r<0.37)tp="regen";
      else if(r<0.47)tp="shield";else if(r<0.55)tp="splitter";
      plan.push(tp);
    }
  }
  return plan;
}
function previewWaveIcons(w){
  const plan=generateWavePlan(w);const count={};
  plan.forEach(k=>count[k]=(count[k]||0)+1);
  const order=Object.keys(count).sort((a,b)=>count[b]-count[a]);
  wavePreviewEl.innerHTML="";
  order.slice(0,5).forEach(k=>{const sp=document.createElement("span");sp.textContent=ENEMY_DEF[k].emoji+"x"+count[k];wavePreviewEl.appendChild(sp);});
}

// ===== Enemy AI =====
function planStep(e){
  const {c,r}=pxToCell(e.x,e.y);if(!inBounds(c,r))return null;
  const here=flow[r][c];
  if(!isFinite(here)||here===0){const g=gridToCenterPx(GOAL.c,GOAL.r);return {tx:g.x,ty:g.y};}
  let best={d:here,c,r};
  for(const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const nc=c+dc,nr=r+dr;if(!inBounds(nc,nr))continue;
    const d=flow[nr][nc];if(d<best.d)best={d,c:nc,r:nr};
  }
  const p=gridToCenterPx(best.c,best.r);return {tx:p.x,ty:p.y};
}

// ===== Damage / Slow =====
function applySlow(e,pct,dur){e.slowMul=Math.min(e.slowMul,1-pct);e.slowT=Math.max(e.slowT,dur);}
function applyDamage(e,amount){
  const real=Math.max(1,amount-(e.armor||0));e.hp-=real;
  if(e.hp<=0&&e.alive)killEnemy(e);
}
function goldPerKill(){return 6*(MODE_DEFS[currentMode]||{goldMul:1}).goldMul;}
function killEnemy(e){
  e.alive=false;
  const isBoss=e.kind==="boss";
  gold+=isBoss?30:goldPerKill();
  kills++;score+=Math.ceil(e.maxHp/8);
  comboCount++;comboTimer=COMBO_WINDOW;
  if(comboCount>=5){
    const bonus=Math.floor(comboCount*.5);gold+=bonus;SFX.combo();
    if(comboCount%5===0)showToast(t("comboBonusMsg",comboCount,bonus),"warn",1000);
  }
  const col=ENEMY_DEF[e.kind].color;
  spawnParticles(e.x,e.y,col,isBoss?24:10,tile*(isBoss?.18:.10),isBoss?.8:.4);
  if(isBoss){spawnParticles(e.x,e.y,"#ffd166",18,tile*.2,.8);triggerShake(7,.4);SFX.kill_boss();}
  else SFX.kill();
  maybeDropPowerup(e);
  if(navigator.vibrate)navigator.vibrate(isBoss?[20,30,20]:8);
  if(e.kind==="splitter"){
    for(let i=0;i<2;i++){
      const m=makeEnemy("minion",Math.max(1,wave));
      m.x=e.x+(Math.random()-.5)*tile*.6;m.y=e.y+(Math.random()-.5)*tile*.6;
      m.target=null;enemies.push(m);
    }
  }
}

// ===== Shooting =====
function tryShoot(t,dt){
  if(t.type==="lightning"){tryShootLightning(t,dt);return;}
  const def=TOWER_DEF[t.type];if(def.fireRate(t.lvl)<=0)return;
  t.cd-=dt;if(t.cd>0)return;
  const center=gridToCenterPx(t.c,t.r);
  const r2=Math.pow(towerRangePx(t),2);
  let target=null,best2=Infinity;
  for(const e of enemies){if(!e.alive)continue;
    const dx=e.x-center.x,dy=e.y-center.y,d2=dx*dx+dy*dy;
    if(d2<=r2&&d2<best2){best2=d2;target=e;}
  }
  if(!target)return;
  const dx=target.x-center.x,dy=target.y-center.y,len=Math.hypot(dx,dy)||1;
  bullets.push({
    x:center.x,y:center.y,vx:dx/len,vy:dy/len,
    speed:def.bulletSpeed*tile,dmg:towerDmg(t),color:def.bulletColor,alive:true,
    splash:def.key==="splash"?{radius:def.splashRadius(t.lvl)*tile,fall:def.splashFall}:null,
    slow:def.key==="slow"?{pct:def.slowPct(t.lvl),dur:def.slowDur(t.lvl)}:null,
  });
  t.shootAnim=0.12;
  const fr=towerFireRate(t);t.cd=fr>0?1/fr:999;
  if(def.key==="basic")SFX.shoot_basic();
  else if(def.key==="slow")SFX.shoot_slow();
  else if(def.key==="splash")SFX.shoot_splash();
}
function tryShootLightning(t,dt){
  const def=TOWER_DEF.lightning;t.cd-=dt;if(t.cd>0)return;
  const center=gridToCenterPx(t.c,t.r);
  const r2=Math.pow(towerRangePx(t),2);
  let primary=null,best2=Infinity;
  for(const e of enemies){if(!e.alive)continue;
    const dx=e.x-center.x,dy=e.y-center.y,d2=dx*dx+dy*dy;
    if(d2<=r2&&d2<best2){best2=d2;primary=e;}
  }
  if(!primary)return;
  const hit=[primary];let dmg=towerDmg(t);
  applyDamage(primary,dmg);
  lightningArcs.push({pts:makeLightningPoints(center.x,center.y,primary.x,primary.y,5),life:0.18});
  let lastHit=primary;
  for(let i=0;i<def.chainCount(t.lvl)-1;i++){
    dmg*=(1-def.chainDecay);
    let next=null,nDist2=Infinity;
    for(const e of enemies){if(!e.alive||hit.includes(e))continue;
      const dx=e.x-lastHit.x,dy=e.y-lastHit.y,d2=dx*dx+dy*dy;
      if(d2<=(def.chainRange*tile)**2&&d2<nDist2){nDist2=d2;next=e;}
    }
    if(!next)break;
    applyDamage(next,dmg);
    lightningArcs.push({pts:makeLightningPoints(lastHit.x,lastHit.y,next.x,next.y,4),life:0.18});
    hit.push(next);lastHit=next;
  }
  t.shootAnim=0.15;
  const fr=towerFireRate(t);t.cd=fr>0?1/fr:999;
  SFX.shoot_lightning();
}

// ===== Bullets =====
function updateBullets(dt){
  for(const b of bullets){if(!b.alive)continue;
    b.x+=b.vx*b.speed*dt;b.y+=b.vy*b.speed*dt;
    if(b.x<-tile||b.y<-tile||b.x>viewW+tile||b.y>viewH+tile){b.alive=false;continue;}
    let hit=null;
    for(const e of enemies){if(!e.alive)continue;
      const dx=e.x-b.x,dy=e.y-b.y;
      if(dx*dx+dy*dy<=Math.pow(tile*.28,2)){hit=e;break;}
    }
    if(hit){
      if(b.splash){
        for(const e of enemies){if(!e.alive)continue;
          const dx=e.x-b.x,dy=e.y-b.y,d=Math.hypot(dx,dy);
          if(d<=b.splash.radius){
            const factor=d<=tile*.3?1:Math.max(.15,1-(d/b.splash.radius)*b.splash.fall);
            applyDamage(e,b.dmg*factor);
            if(b.slow)applySlow(e,b.slow.pct,b.slow.dur);
          }
        }
        spawnParticles(b.x,b.y,"#c084fc",14,tile*.11,.5);
      } else {
        applyDamage(hit,b.dmg);
        if(b.slow)applySlow(hit,b.slow.pct,b.slow.dur);
        spawnParticles(b.x,b.y,b.color,5,tile*.06,.22);
      }
      b.alive=false;
    }
  }
  for(let i=bullets.length-1;i>=0;i--)if(!bullets[i].alive)bullets.splice(i,1);
}

// ===== Enemy update =====
function updateEnemies(dt){
  for(const e of enemies){if(!e.alive)continue;
    if(e.regen>0)e.hp=Math.min(e.maxHp,e.hp+e.regen*dt);
    if(e.slowT>0){e.slowT-=dt;if(e.slowT<=0)e.slowMul=1.0;}
    if(!e.target||Math.hypot(e.target.tx-e.x,e.target.ty-e.y)<1)e.target=planStep(e);
    if(e.target){const dx=e.target.tx-e.x,dy=e.target.ty-e.y,len=Math.hypot(dx,dy)||1;
      e.x+=(dx/len)*e.speed*e.slowMul*dt;e.y+=(dy/len)*e.speed*e.slowMul*dt;}
    const g=gridToCenterPx(GOAL.c,GOAL.r);
    if(Math.hypot(e.x-g.x,e.y-g.y)<tile*.45){
      e.alive=false;lives--;triggerShake(5,.3);SFX.life_lost();
      if(navigator.vibrate)navigator.vibrate([10,40,10]);
      if(lives<=0)gameOver();
    }
  }
  for(let i=enemies.length-1;i>=0;i--)if(!enemies[i].alive)enemies.splice(i,1);
}

// ===== Combo =====
function updateCombo(dt){
  if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0){comboCount=0;comboTimer=0;}}
  if(comboCount>=5){comboDisplayEl.textContent="🔥 "+comboCount+"x Combo";comboDisplayEl.classList.add("active");}
  else comboDisplayEl.classList.remove("active");
}

// ===== Spawning / Waves =====
function startWave(){
  if(spawning||!gameRunning)return;
  wave++;spawnQ=generateWavePlan(wave).slice();spawnTimer=0;spawning=true;
  waveBtn.disabled=true;autoWaveTimer=-1;
  SFX.wave_start();showWaveAnnounce(wave);previewWaveIcons(wave+1);updateHUD();
}
function showWaveAnnounce(w){
  const isBoss=w%5===0&&w>0;
  waveAnnounceEl.textContent=isBoss?t("bossWaveMsg",w):t("waveIncomingMsg",w);
  waveAnnounceEl.style.color=isBoss?"var(--bad)":"var(--accent)";
  waveAnnounceEl.classList.add("show");
  setTimeout(()=>waveAnnounceEl.classList.remove("show"),1600);
}
function updateSpawning(dt){
  if(!spawning)return;
  spawnTimer-=dt;
  if(spawnTimer<=0&&spawnQ.length>0){
    const kind=spawnQ.shift();
    enemies.push(makeEnemy(kind,wave));
    spawnTimer=SPAWN_GAP*(kind==="boss"?2.0:1.0);
  }
  if(spawnQ.length===0&&enemies.length===0){
    spawning=false;
    const bonus=25+8*wave;gold+=bonus;score+=wave*50;
    best=Math.max(best,wave);localStorage.setItem("mazetd_best",String(best));
    showToast(t("waveClearedMsg",wave,bonus),"good",1800);SFX.wave_clear();
    if(MODE_DEFS[currentMode].autoWave){autoWaveTimer=MODE_DEFS[currentMode].autoWaveDelay;}
    else{waveBtn.disabled=false;}
  }
}
function updateAutoWave(dt){
  if(autoWaveTimer<0||!gameRunning)return;
  autoWaveTimer-=dt;
  if(autoWaveTimer<=0){autoWaveTimer=-1;startWave();}
  else{
    waveAnnounceEl.textContent=t("autoWaveIn",Math.ceil(autoWaveTimer));
    waveAnnounceEl.style.color="var(--muted)";
    waveAnnounceEl.classList.add("show");
  }
}

// ===== Placement =====
function canPlace(c,r,type){
  if(!inBounds(c,r)||grid[r][c]!==0)return false;
  if(c===START.c&&r===START.r||c===GOAL.c&&r===GOAL.r)return false;
  if(!TOWER_DEF[type]||gold<TOWER_DEF[type].baseCost)return false;
  return pathExistsAfterPlacing(c,r);
}
function placeTower(c,r,type){
  grid[r][c]=1;towers.push(makeTower(c,r,type));
  gold-=TOWER_DEF[type].baseCost;totalTowersBuilt++;
  buildFlowField();SFX.build();
  spawnParticles(c*tile+tile/2,r*tile+tile/2,TOWER_DEF[type].color,8,tile*.08,.4);
  updateHUD();
}
function towerAt(c,r){return towers.findIndex(t=>t.c===c&&t.r===r);}
function selectTower(idx){
  if(idx<0){selectedTower=null;inspector.classList.remove("show");return;}
  selectedTower=idx;const tw=towers[idx],def=TOWER_DEF[tw.type];
  insType.textContent=t(def.nameKey);insLvl.textContent=tw.lvl;
  insDps.textContent=(towerFireRate(tw)*towerDmg(tw)||0).toFixed(1);
  insRange.textContent=def.range(tw.lvl).toFixed(2);
  insUpCost.textContent=defKeyCost(tw.type,tw.lvl+1)+"💰";
  insRefund.textContent=Math.floor(tw.spent*.7)+"💰";
  inspector.classList.add("show");
}
function upgradeSelected(){
  if(selectedTower==null)return;
  const tw=towers[selectedTower];const cost=defKeyCost(tw.type,tw.lvl+1);
  if(gold<cost){showToast(t("notEnoughGold"),"warn");return;}
  tw.lvl++;tw.spent+=cost;gold-=cost;SFX.upgrade();
  const {x:upx,y:upy}=gridToCenterPx(tw.c,tw.r);
  spawnParticles(upx,upy,"#ffd166",10,tile*.1,.5);
  showToast(t("upgradedMsg",t(TOWER_DEF[tw.type].nameKey),tw.lvl),"good");
  selectTower(selectedTower);updateHUD();
}
function sellSelected(){
  if(selectedTower==null)return;
  const tw=towers[selectedTower];const refund=Math.floor(tw.spent*.7);
  grid[tw.r][tw.c]=0;towers.splice(selectedTower,1);
  gold+=refund;selectedTower=null;inspector.classList.remove("show");
  buildFlowField();SFX.sell();showToast(t("soldMsg",refund));updateHUD();
}

// ===== Rendering =====
function draw(){
  ctx.clearRect(0,0,viewW,viewH);
  let sx=0,sy=0;
  if(shakeT>0){sx=(Math.random()-.5)*2*shakeMag;sy=(Math.random()-.5)*2*shakeMag;ctx.save();ctx.translate(sx,sy);}
  // Grid
  for(let r=0;r<ROWS;r++){for(let c=0;c<COLS;c++){
    const x=c*tile,y=r*tile;
    if(grid[r][c]===2){
      ctx.fillStyle="#2a3547";ctx.fillRect(x,y,tile,tile);
      ctx.fillStyle="#31405a";ctx.fillRect(x+2,y+2,tile-4,tile-4);
      ctx.strokeStyle="#1a2535";ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,tile-1,tile-1);
      ctx.fillStyle="#252f3e";
      ctx.fillRect(x+4,y+4,2,2);ctx.fillRect(x+tile-7,y+tile-7,2,2);
    } else {
      ctx.fillStyle=((c+r)&1)?"#0f141d":"#0b1018";ctx.fillRect(x,y,tile,tile);
      const d=flow[r][c];
      if(isFinite(d)&&grid[r][c]===0){
        const alpha=Math.max(0,Math.min(.15,.15-d*.004));
        if(alpha>0){ctx.fillStyle="rgba(103,232,249,"+alpha+")";ctx.fillRect(x,y,tile,tile);}
      }
      ctx.strokeStyle="#090e15";ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,tile-1,tile-1);
    }
  }}
  // Start/Goal
  const sm=gridToCenterPx(START.c,START.r),gm=gridToCenterPx(GOAL.c,GOAL.r);
  drawGlowSpot(sm.x,sm.y,tile*.30,"#4ee4a6");
  drawGlowSpot(gm.x,gm.y,tile*.30,"#ffb347");
  // Towers
  for(const t of towers)drawTower(t);
  // Lightning arcs
  drawLightningArcs();
  // Enemies
  for(const e of enemies)drawEnemy(e);
  // Bullets
  for(const b of bullets){if(!b.alive)continue;
    ctx.save();ctx.shadowColor=b.color;ctx.shadowBlur=6;
    ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,tile*.09,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  // Particles
  drawParticles();
  // Power-ups
  drawPowerups();
  // Ghost
  if(placingGhost){
    const {c,r}=placingGhost,can=canPlace(c,r,placingType);
    ctx.save();ctx.globalAlpha=.7;
    ctx.fillStyle=can?"rgba(110,249,163,.18)":"rgba(255,107,107,.18)";
    ctx.fillRect(c*tile,r*tile,tile,tile);
    const p=gridToCenterPx(c,r);
    ctx.beginPath();ctx.arc(p.x,p.y,TOWER_DEF[placingType].range(1)*tile,0,Math.PI*2);
    ctx.strokeStyle=can?"rgba(110,249,163,.55)":"rgba(255,107,107,.5)";
    ctx.lineWidth=2;ctx.stroke();ctx.restore();
  }
  if(shakeT>0)ctx.restore();
}

function drawGlowSpot(x,y,r,color){
  ctx.save();ctx.shadowColor=color;ctx.shadowBlur=14;
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.restore();
}

function drawTower(t){
  const p=gridToCenterPx(t.c,t.r),def=TOWER_DEF[t.type];
  const anim=t.shootAnim||0,scale=1+anim*.15;
  ctx.save();ctx.translate(p.x,p.y);ctx.scale(scale,scale);
  if(anim>0){ctx.shadowColor=def.color;ctx.shadowBlur=10*anim;}
  ctx.fillStyle="#0d1220";ctx.strokeStyle=def.color;ctx.lineWidth=2;
  roundRect(ctx,-tile*.38,-tile*.38,tile*.76,tile*.76,7);ctx.fill();ctx.stroke();
  ctx.fillStyle=def.color;
  switch(t.type){
    case "basic":
      ctx.fillRect(-tile*.04,-tile*.04,tile*.28,tile*.08);
      ctx.beginPath();ctx.arc(0,0,tile*.1,0,Math.PI*2);ctx.fill();break;
    case "slow":
      ctx.fillRect(-tile*.22,-tile*.04,tile*.44,tile*.08);
      ctx.fillRect(-tile*.04,-tile*.22,tile*.08,tile*.44);
      ctx.beginPath();ctx.arc(0,0,tile*.07,0,Math.PI*2);ctx.fill();break;
    case "splash":
      ctx.beginPath();ctx.arc(0,0,tile*.14,0,Math.PI*2);ctx.fill();
      for(let a=0;a<4;a++){ctx.save();ctx.rotate((a/4)*Math.PI*2);
        ctx.fillRect(tile*.14,-tile*.03,tile*.1,tile*.06);ctx.restore();}break;
    case "support":
      ctx.beginPath();
      for(let i=0;i<8;i++){const r2=i%2===0?tile*.17:tile*.09,angle=(i/8)*Math.PI*2-Math.PI/2;
        i===0?ctx.moveTo(Math.cos(angle)*r2,Math.sin(angle)*r2):ctx.lineTo(Math.cos(angle)*r2,Math.sin(angle)*r2);}
      ctx.closePath();ctx.fill();break;
    case "lightning":
      for(let i=1;i<=3;i++){
        ctx.beginPath();ctx.arc(0,0,tile*(.05+i*.05),Math.PI*.1,Math.PI*.9);
        ctx.strokeStyle=def.color;ctx.lineWidth=2;ctx.stroke();
        ctx.beginPath();ctx.arc(0,0,tile*(.05+i*.05),-Math.PI*.9,-Math.PI*.1);
        ctx.strokeStyle=def.color;ctx.lineWidth=2;ctx.stroke();}
      ctx.beginPath();ctx.arc(0,0,tile*.06,0,Math.PI*2);ctx.fill();break;
  }
  if(t.lvl>1){ctx.fillStyle="#fff";ctx.font="bold "+Math.max(8,Math.floor(tile*.2))+"px sans-serif";
    ctx.textAlign="center";ctx.textBaseline="bottom";ctx.fillText("L"+t.lvl,0,tile*.38);}
  ctx.restore();
  if(selectedTower!=null&&towers[selectedTower]===t){
    ctx.beginPath();ctx.arc(p.x,p.y,towerRangePx(t),0,Math.PI*2);
    ctx.strokeStyle="rgba(255,255,255,.2)";ctx.lineWidth=1.5;ctx.stroke();
  }
  if(t.type==="support"){
    ctx.beginPath();ctx.arc(p.x,p.y,TOWER_DEF.support.range(t.lvl)*tile,0,Math.PI*2);
    ctx.strokeStyle="rgba(255,209,102,.18)";ctx.lineWidth=1;ctx.setLineDash([5,5]);ctx.stroke();ctx.setLineDash([]);
  }
}

function drawEnemy(e){
  const rad=e.kind==="boss"?tile*.36:e.kind==="minion"?tile*.14:tile*.26;
  const col=ENEMY_DEF[e.kind].color;
  ctx.save();
  if(e.slowMul<1){ctx.shadowColor="#67e8f9";ctx.shadowBlur=8;}
  ctx.fillStyle=col;
  switch(e.kind){
    case "fast":
      ctx.beginPath();ctx.moveTo(e.x+rad,e.y);ctx.lineTo(e.x-rad,e.y-rad*.75);ctx.lineTo(e.x-rad,e.y+rad*.75);ctx.closePath();ctx.fill();break;
    case "tank":case "shield":
      roundRect(ctx,e.x-rad,e.y-rad,rad*2,rad*2,4);ctx.fill();break;
    case "boss":
      ctx.beginPath();ctx.moveTo(e.x,e.y-rad);ctx.lineTo(e.x+rad,e.y);ctx.lineTo(e.x,e.y+rad);ctx.lineTo(e.x-rad,e.y);ctx.closePath();ctx.fill();
      ctx.fillStyle="#ffd166";
      for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(e.x+i*rad*.55,e.y-rad);
        ctx.lineTo(e.x+i*rad*.55-rad*.17,e.y-rad*.62);ctx.lineTo(e.x+i*rad*.55+rad*.17,e.y-rad*.62);ctx.closePath();ctx.fill();}break;
    case "splitter":
      ctx.beginPath();
      for(let i=0;i<6;i++){const angle=(i/6)*Math.PI*2-Math.PI/6;
        i===0?ctx.moveTo(e.x+Math.cos(angle)*rad,e.y+Math.sin(angle)*rad):ctx.lineTo(e.x+Math.cos(angle)*rad,e.y+Math.sin(angle)*rad);}
      ctx.closePath();ctx.fill();break;
    default:ctx.beginPath();ctx.arc(e.x,e.y,rad,0,Math.PI*2);ctx.fill();break;
  }
  if(e.armor>0){ctx.strokeStyle="rgba(110,168,254,.7)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(e.x,e.y,rad+3,0,Math.PI*2);ctx.stroke();}
  ctx.restore();
  const hpPct=clamp(e.hp/e.maxHp,0,1);
  const bw=rad*2,bh=Math.max(2,rad*.28);
  const bx=e.x-rad,by=e.y-rad-(e.kind==="boss"?10:6)-bh;
  ctx.fillStyle="#0c1220";ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle=hpPct>.5?"#7efca5":hpPct>.25?"#ffd166":"#ff6b6b";ctx.fillRect(bx,by,bw*hpPct,bh);
  ctx.strokeStyle="#06090f";ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);
  if(e.slowMul<1){ctx.beginPath();ctx.arc(e.x,e.y,rad+5,0,Math.PI*2);
    ctx.strokeStyle="rgba(103,232,249,.5)";ctx.lineWidth=2;ctx.setLineDash([3,3]);ctx.stroke();ctx.setLineDash([]);}
}

function roundRect(ctx,x,y,w,h,r){
  if(w<2*r)r=w/2;if(h<2*r)r=h/2;
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

// ===== Game loop =====
let last=performance.now();
function loop(now){
  const rawDt=(now-last)/1000;last=now;
  const dt=clamp(rawDt*(paused?0:speed),0,.05*speed);
  if(gameRunning){
    updateSpawning(dt);updateAutoWave(dt);
    for(const t of towers){tryShoot(t,dt);if(t.shootAnim>0)t.shootAnim=Math.max(0,t.shootAnim-dt/.12);}
    updateBullets(dt);updateEnemies(dt);updateParticles(dt);
    updateLightningArcs(dt);updatePowerups(dt);updateCombo(dt);
    if(shakeT>0){shakeT-=rawDt;if(shakeT<=0){shakeT=0;shakeMag=0;}}
  }
  draw();updateHUD();requestAnimationFrame(loop);
}

// ===== Map init / Game state =====
function initMap(){
  const mapDef=MAP_DEFS[currentMap];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)grid[r][c]=0;
  for(const [wc,wr] of mapDef.walls)if(inBounds(wc,wr))grid[wr][wc]=2;
  START.c=mapDef.start.c;START.r=mapDef.start.r;
  GOAL.c=mapDef.goal.c;GOAL.r=mapDef.goal.r;
}
function resetGame(){
  const modeDef=MODE_DEFS[currentMode];
  initMap();
  towers.length=0;enemies.length=0;bullets.length=0;particles.length=0;
  powerups.length=0;lightningArcs.length=0;
  wave=0;lives=modeDef.startLives;gold=modeDef.startGold;
  kills=0;totalTowersBuilt=0;score=0;
  spawning=false;spawnQ.length=0;spawnTimer=0;autoWaveTimer=-1;
  placingType="basic";placingGhost=null;selectedTower=null;
  comboCount=0;comboTimer=0;shakeT=0;shakeMag=0;
  buildFlowField();rebuildPalette();updateHUD();
  previewWaveIcons(1);inspector.classList.remove("show");
  gameOverOverlay.classList.add("hidden");
  waveBtn.disabled=false;gameRunning=true;updateModeBadge();
}
function gameOver(){
  gameRunning=false;spawning=false;
  best=Math.max(best,wave);localStorage.setItem("mazetd_best",String(best));
  SFX.game_over();
  document.getElementById("goWave").textContent=wave;
  document.getElementById("goBest").textContent=best;
  document.getElementById("goKills").textContent=kills;
  document.getElementById("goScore").textContent=score;
  gameOverOverlay.classList.remove("hidden");
}

// ===== Input =====
canvas.addEventListener("pointermove",ev=>{
  const rect=canvas.getBoundingClientRect();
  const {c,r}=pxToCell(ev.clientX-rect.left,ev.clientY-rect.top);
  placingGhost=inBounds(c,r)?{c,r}:null;
});
canvas.addEventListener("pointerleave",()=>placingGhost=null);
canvas.addEventListener("pointerdown",ev=>{
  if(!gameRunning)return;
  const rect=canvas.getBoundingClientRect();
  const px=ev.clientX-rect.left,py=ev.clientY-rect.top;
  if(checkPowerupClick(px,py))return;
  const {c,r}=pxToCell(px,py);
  if(!inBounds(c,r))return;
  const idx=towerAt(c,r);
  if(idx>=0){selectTower(idx);return;}
  if(selectedTower!=null){selectTower(-1);return;}
  if(canPlace(c,r,placingType)){placeTower(c,r,placingType);}
  else{
    if(grid[r][c]!==0)showToast(t("cellOccupied"),"warn");
    else if(c===START.c&&r===START.r||c===GOAL.c&&r===GOAL.r)showToast(t("noStartGoal"),"warn");
    else if(gold<TOWER_DEF[placingType].baseCost)showToast(t("notEnoughGold"),"warn");
    else showToast(t("wouldBlockPath"),"bad");
  }
});
document.addEventListener("keydown",ev=>{
  if(ev.target.tagName==="INPUT")return;
  switch(ev.key){
    case "1":case "2":case "3":case "4":case "5":{
      const keys=Object.keys(TOWER_DEF);const idx=parseInt(ev.key)-1;
      if(keys[idx]){placingType=keys[idx];rebuildPalette();}break;}
    case " ":ev.preventDefault();togglePause();break;
    case "Enter":ev.preventDefault();startWave();break;
    case "u":case "U":upgradeSelected();break;
    case "Delete":case "Backspace":sellSelected();break;
    case "Escape":selectTower(-1);break;
    case "m":case "M":toggleMute();break;
  }
});
function togglePause(){if(!gameRunning)return;paused=!paused;pauseBtn.textContent=paused?"▶":"⏸";showToast(paused?t("pausedMsg"):t("resumedMsg"));}
function toggleMute(){muted=!muted;muteBtn.textContent=muted?"🔇":"🔊";showToast(muted?t("mutedMsg"):t("soundOnMsg"));}
function setSpeed(s){speed=s;[speed1,speed2,speed3].forEach((b,i)=>b.classList.toggle("active-spd",i+1===s));}
waveBtn.addEventListener("click",startWave);
pauseBtn.addEventListener("click",togglePause);
muteBtn.addEventListener("click",toggleMute);
langBtn.addEventListener("click",()=>{
  currentLang=LANGS[(LANGS.indexOf(currentLang)+1)%LANGS.length];
  localStorage.setItem("mazetd_lang",currentLang);applyTranslations();
});
upgradeBtn.addEventListener("click",upgradeSelected);
sellBtn.addEventListener("click",sellSelected);
closeInspectorBtn.addEventListener("click",()=>selectTower(-1));
speed1.addEventListener("click",()=>setSpeed(1));
speed2.addEventListener("click",()=>setSpeed(2));
speed3.addEventListener("click",()=>setSpeed(3));
document.getElementById("startBtn").addEventListener("click",()=>{startOverlay.classList.add("hidden");resetGame();});
document.getElementById("restartBtn").addEventListener("click",()=>{resetGame();});

// ===== Init =====
function init(){
  DPR=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  resize();buildFlowField();
  buildLangRow();applyTranslations();
  updateHUD();previewWaveIcons(1);
  requestAnimationFrame(loop);
}
window.addEventListener("load",init);

})();
</script>
</body>
